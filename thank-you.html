<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Sheff Autos</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, rgba(214, 0, 28, 0.08) 0%, transparent 60%), #F8FAFC;
      padding: 1.5rem;
    }
    .thank-you-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      animation: fadeInUp 0.6s ease forwards;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background: rgba(37, 211, 102, 0.12);
      color: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1.5rem;
      border: 2px solid rgba(37, 211, 102, 0.25);
    }
    .timer-badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1.25rem;
      background: #EDF2F7;
      color: #475569;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 999px;
    }
    .timer-badge span {
      color: #D6001C;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="thank-you-card">
    <div class="success-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    
    <h1 style="font-size: 2rem; font-weight: 800; color: #0F172A; margin-bottom: 0.75rem;">
      Thank You!
    </h1>
    
    <p style="color: #475569; font-size: 1.05rem; line-height: 1.6; margin-bottom: 1.5rem;">
      Your inquiry has been successfully submitted to <strong>Sheff Autos</strong>. Our team will get back to you shortly.
    </p>

    <a href="index.html" class="btn btn-primary" style="padding: 0.85rem 2rem;">
      <i class="fa-solid fa-house"></i> Return to Homepage Now
    </a>

    <div class="timer-badge">
      Redirecting automatically in <span id="countdown">3</span> seconds...
    </div>
  </div>

  <script>
    // 3-second Countdown & Automatic Redirect Back to Main Website
    let secondsLeft = 3;
    const countdownEl = document.getElementById('countdown');

    const interval = setInterval(() => {
      secondsLeft--;
      if (countdownEl) {
        countdownEl.innerText = secondsLeft;
      }
      if (secondsLeft <= 0) {
        clearInterval(interval);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>
</body>
</html>
